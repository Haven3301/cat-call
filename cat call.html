<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catnap — Cat Facts</title>
  <style>
    :root {
      --cream: #fff8ec;
      --ink: #302923;
      --coral: #ef7357;
      --gold: #f4bd52;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #f4bd5228 0 5px, transparent 6px),
        radial-gradient(circle at 86% 78%, #ef735720 0 7px, transparent 8px),
        var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(100%, 620px);
      text-align: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 42px;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .12em;
    }

    header a {
      color: inherit;
      text-decoration: none;
      font-size: .9rem;
    }

    .card {
      padding: clamp(28px, 7vw, 56px);
      background: var(--white);
      border: 1px solid #30292312;
      border-radius: 28px;
      box-shadow: 0 18px 50px #60472b14;
    }

    .cat {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      letter-spacing: -.06em;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #756b62;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 15px 24px;
      color: white;
      background: var(--coral);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 0 #c9523a;
      transition: transform .15s, box-shadow .15s, background .15s;
    }

    button:hover {
      background: #e76549;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #c9523a;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #c9523a;
    }

    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 5px;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .fact-box {
      min-height: 112px;
      display: grid;
      place-items: center;
      margin-top: 28px;
      padding: 22px;
      border-radius: 18px;
      background: var(--cream);
      line-height: 1.7;
    }

    #fact { margin: 0; }
    #status { margin: 12px 0 0; color: #756b62; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="logo">🐾 CATNAP</div>
      <a href="#about">A little cat curiosity</a>
    </header>

    <section class="card" aria-labelledby="title">
      <div class="cat" aria-hidden="true">🐈</div>
      <h1 id="title">Curious cat?</h1>
      <p class="subtitle">Get a tiny fact for your feline-loving brain.</p>

      <button id="factButton" type="button">🐾 Get a cat fact</button>

      <div class="fact-box" aria-live="polite" aria-atomic="true">
        <p id="fact">Your next fun fact is just one tap away.</p>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>

  <script>
    const button = document.querySelector("#factButton");
    const fact = document.querySelector("#fact");
    const status = document.querySelector("#status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      fact.textContent = "Finding a fact…";
      status.textContent = "";

      try {
        const response = await fetch("https://catfact.ninja/fact");
        if (!response.ok) throw new Error("The request failed.");

        const data = await response.json();
        if (!data.fact) throw new Error("No furry cum back.");

        fact.textContent = data.fact;
      } catch (error) {
        fact.textContent = "Couldn't fetch a fact right now. Please try again.";
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
